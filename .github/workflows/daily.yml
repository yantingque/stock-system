# ================================================================
# GitHub Actions 排程設定：平日台灣時間 16:30 自動執行每日管線
# 放置位置固定是 repo 根目錄的 .github/workflows/daily.yml
# ================================================================
name: daily-stock-pipeline

on:
  schedule:
    # cron 用 UTC 時間：08:30 UTC = 台灣 16:30；1-5 = 週一到週五
    # 注意：GitHub 排程不保證準時，尖峰可能延遲 10~30 分鐘——
    # 程式內建的日期防呆讓延遲完全無害
    - cron: "30 8 * * 1-5"
  # 額外提供「手動觸發」按鈕（Actions 頁面 → Run workflow），測試時用
  workflow_dispatch:

# 允許 workflow 把更新後的資料庫 commit 回 repo
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest          # GitHub 提供的臨時 Linux 機器
    steps:
      # 1) 把 repo 內容抓下來（包含程式和昨天為止的 stock_data.db）
      - uses: actions/checkout@v4

      # 2) 安裝 Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3) 依 requirements.txt 安裝套件
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4) 把 Google 金鑰（存在 Secrets 裡的 JSON 內容）寫成暫存檔
      #    printf '%s' 原樣輸出，JSON 的換行與符號都不會被動到
      - name: Write Google service account key
        env:
          GSHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.GSHEET_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GSHEET_SERVICE_ACCOUNT_JSON" > service_account.json

      # 5) 執行每日管線；秘密以環境變數注入，config.py 會讀到
      - name: Run daily pipeline
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
          GSHEET_NAME: ${{ secrets.GSHEET_NAME }}
        run: python daily_run.py

      # 6) 把更新後的資料庫 commit 回 repo（資料因此每天延續累積）
      #    「git diff --cached --quiet ||」= 有變動才 commit，沒變動安靜跳過
      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data.db
          git diff --cached --quiet || git commit -m "每日資料更新 $(TZ=Asia/Taipei date +%F)"
          git push
